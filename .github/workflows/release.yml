name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # darwin only: net_darwin.go is excluded elsewhere by filename, and lipo
    # ships with the macOS runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27'

      # Separate artifacts rather than one universal binary, so a download is
      # about half the size for someone who only needs one architecture.
      # The amd64 build is named x86_64 to match what `uname -m` prints, which
      # is what the install command in the README substitutes into the URL.
      - name: Build arm64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o wifimeter-darwin-arm64 .
      - name: Build x86_64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o wifimeter-darwin-x86_64 .

      - name: Checksums
        run: shasum -a 256 wifimeter-darwin-arm64 wifimeter-darwin-x86_64 > SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            wifimeter-darwin-arm64 wifimeter-darwin-x86_64 SHA256SUMS
